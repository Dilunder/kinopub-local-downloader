name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Prepare FFmpeg with checksum verification
        run: python scripts/prepare_ffmpeg.py
      - name: Build executable
        run: python scripts/build_windows.py
      - name: Verify the actual EXE without Python on PATH
        run: python scripts/verify_windows_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: KinoPub-Windows-x64
          path: |
            outputs/KinoPub-Local-Downloader.exe
            outputs/SHA256SUMS.txt
            outputs/WINDOWS-README.txt
            outputs/third-party-notices.zip
            outputs/windows-exe-verification.json
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KinoPub-Windows-x64
          path: release-assets
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "KinoPub $RELEASE_TAG" release-assets/*
